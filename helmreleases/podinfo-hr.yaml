---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo-hr
  namespace: default
spec:
  chart:
    spec:
      chart: podinfo
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: podinfo-helm-repo
      version: 7.16.0
  interval: 1m0s
  install:
    remediation:
      retries: 2
      remediateLastFailure: true
  upgrade:
    strategy:
      name: 'RetryOnFailure'
      retryInterval: 1m
    remediation:
      retries: 2
      #strategy: 'uninstall'
      remediateLastFailure: false
  values:
    replicaCount: 3
