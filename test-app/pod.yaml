apiVersion: v1
kind: Pod
metadata:
  name: basic-auth-app
  namespace: default
  labels:
    app: basic-auth-app
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "App gestartet. Benutzer aus Secret: $BASIC_AUTH_USER"
          while true; do sleep 3600; done
      env:
        - name: BASIC_AUTH_USER
          valueFrom:
            secretKeyRef:
              name: basic-auth
              key: user
        - name: BASIC_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: basic-auth
              key: password
      volumeMounts:
        - name: secret-volume
          mountPath: /etc/secrets
          readOnly: true
  volumes:
    - name: secret-volume
      secret:
        secretName: basic-auth
